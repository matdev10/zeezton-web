<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login Zeezton</title>
</head>
<body>

<h1>Login Cliente</h1>

<form method="post">
    {% csrf_token %}

    <input type="text"
           name="username"
           placeholder="Usuario">

    <input type="password"
           name="password"
           placeholder="Contraseña">

    <button type="submit">
        Iniciar sesión
    </button>
</form>

</body>
</html>
